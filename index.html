<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FRAGMENTS ARCHIVE</title>
  <style>
    :root {
      --gb-darkest: #0f380f;
      --gb-dark: #306230;
      --gb-light: #8bac0f;
      --gb-lightest: #9bbc0f;
      --max-width: 500px;
    }

    body {
      background-color: #0d0d0d;
      color: #e0e0e0;
      font-family: "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: var(--max-width);
    }

    /* タイトル画像 */
    .title-img {
      width: 100%;
      height: auto;
      display: block;
      margin-bottom: 20px;
      image-rendering: pixelated;
    }

    /* GB風メニューリスト */
    .menu-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .menu-item {
      margin-bottom: 10px;
    }

    .menu-button {
      width: 100%;
      background-color: var(--gb-darkest);
      color: var(--gb-lightest);
      border: 2px solid var(--gb-light);
      padding: 12px;
      text-align: left;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
    }

    .menu-button:hover {
      background-color: var(--gb-dark);
      color: #ffffff;
    }

    .menu-id {
      font-size: 0.8rem;
      color: var(--gb-light);
    }

    /* 詳細画面 */
    .detail-card {
      background-color: #1a1a1a;
      border: 2px solid var(--gb-dark);
      border-radius: 8px;
      padding: 15px;
    }

    .back-btn {
      background-color: var(--gb-dark);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .title-jp {
      font-size: 1.4rem;
      color: var(--gb-lightest);
      margin: 0 0 4px 0;
    }

    .title-en {
      font-size: 0.85rem;
      color: var(--gb-light);
      margin: 0 0 15px 0;
      border-bottom: 1px dashed var(--gb-dark);
      padding-bottom: 8px;
    }

    /* 文章（折り返しと意図的改行の両立） */
    .body-text p {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #ccc;
      margin: 0 0 12px 0;
      word-break: break-word; /* 画面幅での自動折り返し */
    }

    /* ドット絵画像 */
    .pixel-art {
      width: 100%;
      height: auto;
      display: block;
      margin-top: 15px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 1. メニュー画面 -->
    <div id="menu-screen">
      <!-- GB風タイトル画像 -->
      <img src="title.png" alt="タイトル画面" class="title-img" onerror="this.style.display='none'">
      <ul id="menu-list" class="menu-list"></ul>
    </div>

    <!-- 2. 詳細画面 -->
    <div id="detail-screen" class="detail-card hidden">
      <button class="back-btn" onclick="showMenu()">◀ メニューへ戻る</button>
      <h1 id="detail-jp" class="title-jp"></h1>
      <h2 id="detail-en" class="title-en"></h2>
      <div id="detail-text" class="body-text"></div>
      
      <!-- fragments/ フォルダから読み込まれる2枚の画像 -->
      <img id="detail-cg" class="pixel-art" src="" alt="CG画像">
      <img id="detail-text-cg" class="pixel-art" src="" alt="テキストCG画像">
    </div>
  </div>

  <script>
    let fragmentsData = [];

    // JSONデータの読み込み
    fetch('data.json')
      .then(response => response.json())
      .then(data => {
        fragmentsData = data;
        renderMenu();
        checkHash(); // URLハッシュ（#A01等）の直接アクセスチェック
      });

    // メニューの自動生成
    function renderMenu() {
      const listEl = document.getElementById('menu-list');
      listEl.innerHTML = '';
      fragmentsData.forEach(item => {
        const li = document.createElement('li');
        li.className = 'menu-item';
        li.innerHTML = `
          <button class="menu-button" onclick="showDetail('${item.id}')">
            <span>▶ ${item.title_jp}</span>
            <span class="menu-id">[${item.id}]</span>
          </button>
        `;
        listEl.appendChild(li);
      });
    }

    // 詳細画面の表示
    function showDetail(id) {
      const item = fragmentsData.find(d => d.id === id);
      if (!item) return;

      document.getElementById('detail-jp').textContent = item.title_jp;
      document.getElementById('detail-en').textContent = item.title_en;

      // 段落の組み立て（自動折り返し＋配列による意図的改行）
      const textContainer = document.getElementById('detail-text');
      textContainer.innerHTML = '';
      item.body_text.forEach(paragraph => {
        const p = document.createElement('p');
        p.textContent = paragraph;
        textContainer.appendChild(p);
      });

      // fragments/ フォルダ内の画像パスを自動生成
      document.getElementById('detail-cg').src = `fragments/${item.id}_CG.png`;
      document.getElementById('detail-text-cg').src = `fragments/${item.id}_text.png`;

      // 画面切り替え
      document.getElementById('menu-screen').classList.add('hidden');
      document.getElementById('detail-screen').classList.remove('hidden');
      window.location.hash = id;
    }

    // メニュー画面への戻り処理
    function showMenu() {
      document.getElementById('detail-screen').classList.add('hidden');
      document.getElementById('menu-screen').classList.remove('hidden');
      history.replaceState(null, null, ' ');
    }

    // URLに直接 #A01 などが付いていた場合の初期表示対応
    function checkHash() {
      const hash = window.location.hash.replace('#', '');
      if (hash) showDetail(hash);
    }
  </script>
</body>
</html>
